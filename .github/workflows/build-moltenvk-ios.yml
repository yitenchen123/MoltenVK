name: Build MoltenVK iOS dylib (Vulkan 1.4)

on:
  workflow_dispatch:

jobs:
  build-ios-dylib:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Fetch dependencies
        run: |
          ./fetchDependencies --ios

      - name: Build iOS device dylib
        run: make ios

      - name: Build iOS simulator dylib
        run: make iossim

      - name: Collect libMoltenVK.dylib from xcframework
        run: |
          set -e
          XF="Package/Release/MoltenVK.xcframework"
          echo "== xcframework 结构 =="
          find "$XF" -maxdepth 3 | head -40
          mkdir -p dist

          # 提取每个平台 slice 中的动态库，重命名为 libMoltenVK.dylib
          for dir in "$XF"/*/; do
            plat=$(basename "$dir")
            bin="$dir/MoltenVK.framework/MoltenVK"
            if [ -f "$bin" ]; then
              archs=$(lipo -archs "$bin")
              echo "== $plat: $(file "$bin" | sed 's/.*: //')"
              mkdir -p "dist/$plat"
              cp "$bin" "dist/$plat/libMoltenVK.dylib"
              install_name_tool -id "@rpath/libMoltenVK.dylib" "dist/$plat/libMoltenVK.dylib"
              echo "archs: $archs"
            fi
          done

          # 附带 icd json
          find Package/Release -name "*icd*.json" -exec cp {} dist/ \; 2>/dev/null || true

          # 完整保留 xcframework 与 framework
          cp -R "$XF" dist/ 2>/dev/null || true

          echo "== dist 内容 =="
          find dist -type f | sort

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moltenvk-ios-dylib
          path: dist/
          if-no-files-found: error
